name: PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  verify:
    name: Verify (typecheck, test, build, audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit (allowlisted)
        run: npm run audit

      - name: Typecheck
        run: npm run lint

      - name: Run tests
        run: npm test -- --run

      - name: Build project
        run: npm run build
